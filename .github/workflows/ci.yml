name: Test and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and Linux PTY integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build single file
        run: python scripts/build.py
      - name: Verify release and local installation
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          python linsail.pyz --version
          LINSAIL_NO_PATH=1 LINSAIL_BIN_DIR="$RUNNER_TEMP/linsail-bin" sh install-python.sh
          "$RUNNER_TEMP/linsail-bin/linsail" --version
      - name: Verify published upgrade rollback and uninstall
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-22.04' && matrix.python == '3.12'
        run: |
          stage=$(mktemp -d)
          export HOME="$stage/home" SHELL=/bin/bash
          export LINSAIL_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$HOME" "$stage/a3" "$stage/a4"
          for version in a3 a4; do
            base="https://github.com/caissonfiv/LinSail/releases/download/v0.1.0$version"
            curl -fsSL "$base/linsail-linux-x86_64" -o "$stage/$version/linsail-linux-x86_64"
            curl -fsSL "$base/SHA256SUMS" -o "$stage/$version/SHA256SUMS"
            (cd "$stage/$version" && awk '$2 == "linsail-linux-x86_64"' SHA256SUMS | sha256sum --check)
            chmod +x "$stage/$version/linsail-linux-x86_64"
          done
          "$stage/a3/linsail-linux-x86_64" install
          "$stage/a4/linsail-linux-x86_64" install
          "$LINSAIL_BIN_DIR/linsail" update --check
          "$LINSAIL_BIN_DIR/linsail" update --to 0.1.0a4
          "$LINSAIL_BIN_DIR/linsail" rollback
          test "$("$LINSAIL_BIN_DIR/linsail" --version)" = 0.1.0a3
          "$stage/a4/linsail-linux-x86_64" install
          "$LINSAIL_BIN_DIR/linsail" update --to 0.1.0a3
          test "$("$LINSAIL_BIN_DIR/linsail" --version)" = 0.1.0a3
          "$stage/a4/linsail-linux-x86_64" install
          mkdir -p "$HOME/.config/linsail"
          printf '%s' '{"profiles": {}, "active": ""}' > "$HOME/.config/linsail/config.json"
          "$LINSAIL_BIN_DIR/linsail" uninstall --yes
          test ! -e "$LINSAIL_BIN_DIR/linsail"
          test -f "$HOME/.config/linsail/config.json"
          ! grep -q '# >>> LinSail PATH >>>' "$HOME/.bashrc"
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        with:
          name: linsail-alpha
          path: dist/*
