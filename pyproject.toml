[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linsail-terminal"
version = "0.1.0a1"
description = "A small Linux terminal agent with human shell handoff"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
linsail = "linsail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
